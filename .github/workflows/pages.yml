name: Publish Oddloop42 website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Configure SEO and prepare public files
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python configure_seo.py "$SITE_URL"
          mkdir _site
          cp index.html robots.txt sitemap.xml _site/
          cp -R assets designs _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
